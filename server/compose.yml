services:
  search-reader-mcp:
    build: .
    image: search-reader-mcp:latest
    container_name: search-reader-mcp
    ports:
      - "18081:18081"
    environment:
      # ---- 默认值集中在此,用户按需手工改 ----
      PORT: "18081"                            # 容器内监听端口(对外同端口)
      HOST: "0.0.0.0"
      BOCHA_API_KEY: "${BOCHA_API_KEY:-}"      # 标准环境变量,开发/compose 共用
      BOCHA_URL: "https://api.bochaai.com"
      JINA_APP: "/app"                         # jina 镜像应用根目录
      # ---- 一期增强(v7)新增 env ----
      READ_CACHE_TTL: "600"                    # read 缓存 TTL(秒),命中后滑动续期(默认 10 分钟)
      READ_TIMEOUT: "90"                       # HTTP 层整体超时兜底(秒),超时 504
      SERVER_URL: "http://localhost:18081"     # 服务端对外地址(上传解析提示词模板渲染用;云部署改为公网地址)
      # MCP_* 描述 env:缺省 = 内建工具/参数描述,有值即覆盖。
      # 模式:MCP_<TOOL>_DESC = 工具描述、MCP_<TOOL>_<PARAM> = 参数描述;
      # 例:MCP_SEARCH_DESC、MCP_READ_DESC、MCP_READ_URI、MCP_READ_LENGTH。
      # 未设置的描述沿用内建,不在此逐一列举(任意 MCP_* 描述变量均生效)。
    volumes:
      # 持久化目录外挂到宿主 ~/.search_reader_mcp/;sqlite 缓存库与配置文件都在这。
      # 用 `~` 而非 ${HOME}:compose 会把 `~` 展开为当前用户 home,Windows/Linux 通用
      # (${HOME} 在 cmd/PowerShell 下未设置,会解析成空串导致挂载到根路径、容器内无写权限)。
      - "~/.search_reader_mcp:/app/extension/data"
    restart: unless-stopped
