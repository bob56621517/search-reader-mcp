name: docker-image

# 里程碑发布:push 形如 v0.2.0 的 tag 时,构建 server/Dockerfile 并推送镜像到 GHCR
# (v0.3 双产出物:server/ 为容器项目;client/ 为本地 stdio MCP,不在此 workflow 构建)
on:
  push:
    tags:
      - 'v*'

jobs:
  # 门禁:双产出物宿主测试(server 与 client 各自 npm ci + npm test,均不依赖容器;
  # client 主接缝测试经 stdio 连真实 client,server HTTP 与 docker 在注入点打桩)
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            client/package-lock.json
      - working-directory: server
        run: npm ci
      - working-directory: server
        run: npm test
      - working-directory: client
        run: npm ci
      - working-directory: client
        run: npm test

  # 构建并推送镜像(依赖 test 通过)
  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./server
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
